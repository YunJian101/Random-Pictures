<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户中心 · 随机图 API</title>
<link rel="icon" id="favicon" href="/static/favicon.svg" type="image/svg+xml">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/page-admin.css">
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      onerror="this.onerror=null;this.href='https://lib.baomitu.com/font-awesome/6.5.1/css/all.min.css'">
<style>
  /* 用户中心专用：预览区与代码区 */
  .preview-stage {
    position: relative;
    display: grid;
    place-items: center;
    min-height: 300px;
    /* 过高的图让容器内部滚动，避免被压成窄条后左右留白 */
    max-height: 76vh;
    overflow: auto;
    border-radius: var(--r-md);
    border: 1px solid var(--line);
    background: var(--surface-2);
    overflow: hidden;
  }
  .preview-stage img { display: block; width: 100%; height: auto; }
  .preview-stage:has(img) { min-height: 0; }
  .preview-empty { display: grid; place-items: center; gap: 10px; color: var(--text-3); padding: 40px 20px; }
  .preview-empty i { font-size: 28px; opacity: 0.6; }

  .code-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .code-tabs .tab { border: 1px solid var(--line); background: var(--surface); }
  .code-tabs .tab.is-active { border-color: var(--primary-weak-2); }

  .fb-item {
    padding: 16px 18px;
    border-radius: var(--r-md);
    border: 1px solid var(--line);
    background: var(--surface);
  }
  .fb-item + .fb-item { margin-top: 12px; }
  .fb-item__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .fb-item__content { margin-top: 10px; font-size: 13.5px; color: var(--text-2); line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .fb-hint {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: var(--r-sm);
    background: var(--surface-2);
    border: 1px dashed var(--line-strong);
    font-size: 12.5px;
    color: var(--text-3);
  }
  .fb-hint i { flex: 0 0 auto; }

  .profile-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .profile-row:last-child { border-bottom: 0; }
  .profile-row dt { font-size: 13px; color: var(--text-3); }
  .profile-row dd { margin: 0; font-size: 13.5px; font-weight: 550; }
</style>
</head>
<body>

<div class="sidebar-overlay" data-sidebar-close></div>

<div class="admin">
  <!-- ================= 侧边栏 ================= -->
  <aside class="sidebar" id="sidebar">
    <a class="sidebar__brand" href="/">
      <span class="brand__mark"><i class="fa-solid fa-images"></i></span>
      <span class="brand__name" data-site-name>随机图 API</span>
    </a>

    <div class="sidebar__group">
      <div class="sidebar__label">使用</div>
      <nav class="sidebar__nav">
        <button class="sidebar__item is-active" data-view="quick"><i class="fa-solid fa-bolt"></i>快捷调用</button>
      </nav>
    </div>

    <div class="sidebar__group">
      <div class="sidebar__label">账号</div>
      <nav class="sidebar__nav">
        <button class="sidebar__item" data-view="feedback">
          <i class="fa-solid fa-comment-dots"></i>我的反馈
          <span class="badge badge--muted" id="fb-count-badge">0</span>
        </button>
        <button class="sidebar__item" data-view="profile"><i class="fa-solid fa-user"></i>账号信息</button>
      </nav>
    </div>

    <div class="sidebar__foot">
      <a class="sidebar__item" href="/"><i class="fa-solid fa-house"></i>返回首页</a>
      <div class="sidebar__user">
        <div class="sidebar__avatar" id="avatar">U</div>
        <div class="sidebar__user-meta">
          <div class="sidebar__user-name" id="side-username">加载中</div>
          <div class="sidebar__user-role" id="side-role">—</div>
        </div>
        <button class="icon-btn" id="logout-btn" title="退出登录" aria-label="退出登录">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </div>
  </aside>

  <!-- ================= 主区域 ================= -->
  <div class="admin__main">
    <header class="topbar">
      <div class="topbar__left">
        <button class="icon-btn topbar__menu" data-sidebar-toggle aria-label="菜单"><i class="fa-solid fa-bars"></i></button>
        <div>
          <div class="topbar__title" id="page-title">快捷调用</div>
          <div class="topbar__sub" id="page-sub">生成可直接使用的图片链接</div>
        </div>
      </div>
      <div class="topbar__right">
        <button class="icon-btn icon-btn--bordered" data-theme-toggle aria-label="切换主题">
          <i class="fa-solid fa-moon" data-theme-icon></i>
        </button>
        <a class="icon-btn icon-btn--bordered" href="/" title="返回首页"><i class="fa-solid fa-house"></i></a>
      </div>
    </header>

    <div class="admin__content">

      <!-- ---------- 快捷调用 ---------- -->
      <section class="view" data-view-panel="quick">
        <div class="welcome">
          <div>
            <div class="welcome__title">你好，<span id="hello-name">朋友</span> 👋</div>
            <div class="welcome__desc">选择分类即可生成直链，接口直接返回图片，无需解析 JSON。</div>
          </div>
          <button class="btn btn--primary btn--sm" id="preview-btn"><i class="fa-solid fa-eye"></i>预览效果</button>
        </div>

        <div class="card card--pad">
          <div class="form-grid">
            <div class="field">
              <label class="label" for="category-select">图片分类</label>
              <select class="select" id="category-select">
                <option value="">全部（全局随机）</option>
              </select>
            </div>
            <div class="field">
              <label class="label" for="code-style">代码形式</label>
              <div class="code-tabs" id="code-style">
                <button class="tab is-active" data-style="url">直链</button>
                <button class="tab" data-style="html">HTML</button>
                <button class="tab" data-style="markdown">Markdown</button>
                <button class="tab" data-style="js">JavaScript</button>
                <button class="tab" data-style="python">Python</button>
              </div>
            </div>
          </div>

          <div class="field" style="margin-top:16px">
            <div class="row--between">
              <span class="label">调用代码</span>
              <button class="btn btn--soft btn--sm" id="copy-code"><i class="fa-solid fa-copy"></i>复制</button>
            </div>
            <div class="code" id="code-output" style="min-height:96px;white-space:pre-wrap;word-break:break-all"></div>
          </div>
        </div>

        <div class="card card--pad">
          <div class="row--between" style="margin-bottom:14px">
            <h3 style="font-size:15px">效果预览</h3>
            <div class="row gap-2">
              <button class="btn btn--outline btn--sm" id="refresh-preview"><i class="fa-solid fa-rotate"></i>换一张</button>
              <a class="btn btn--outline btn--sm" id="open-preview" target="_blank" rel="noopener">
                <i class="fa-solid fa-up-right-from-square"></i>新窗口
              </a>
            </div>
          </div>
          <div class="preview-stage" id="preview-stage">
            <div class="preview-empty" id="preview-empty">
              <i class="fa-solid fa-image"></i>
              <p class="small">点击「预览效果」加载一张随机图片</p>
            </div>
          </div>
          <div class="demo__meta" id="preview-meta" style="display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:12.5px;color:var(--text-3)">
            <span><i class="fa-regular fa-circle-dot"></i>尚未加载</span>
          </div>
        </div>
      </section>

      <!-- ---------- 我的反馈 ---------- -->
      <section class="view hidden" data-view-panel="feedback">
        <div class="form-grid" style="grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start">
          <div class="card card--pad">
            <div class="row--between" style="margin-bottom:14px">
              <h3 style="font-size:15px">我的反馈</h3>
              <span class="tiny dim" id="fb-total">—</span>
            </div>
            <div id="fb-list" class="stagger">
              <div class="empty"><div class="spinner"></div><p>加载中…</p></div>
            </div>
          </div>

          <div class="card card--pad">
            <h3 style="font-size:15px;margin-bottom:14px">提交新反馈</h3>
            <form class="stack gap-4" id="feedback-form" novalidate>
              <div class="field">
                <label class="label" for="feedback-type">类型</label>
                <select class="select" id="feedback-type">
                  <option value="功能建议">功能建议</option>
                  <option value="问题反馈">问题反馈</option>
                  <option value="合作咨询">合作咨询</option>
                  <option value="其他">其他</option>
                </select>
              </div>
              <div class="field">
                <label class="label" for="feedback-content">内容</label>
                <textarea class="textarea" id="feedback-content" maxlength="900"
                          placeholder="请描述你遇到的问题或建议…" required></textarea>
                <div class="row--between tiny dim">
                  <span>管理员回复后会显示在左侧列表</span>
                  <span id="char-count">0 / 900</span>
                </div>
              </div>
              <button class="btn btn--primary" type="submit" id="feedback-submit">
                <i class="fa-solid fa-paper-plane"></i>提交反馈
              </button>
            </form>
          </div>
        </div>
      </section>

      <!-- ---------- 账号信息 ---------- -->
      <section class="view hidden" data-view-panel="profile">
        <div class="grid" style="grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start">
          <!-- 基本资料 -->
          <div class="card card--pad">
            <div class="row--between" style="margin-bottom:14px">
              <h3 style="font-size:15px">基本资料</h3>
              <span class="badge badge--muted" id="p-role-badge">—</span>
            </div>

            <form class="stack gap-4" id="profile-form" novalidate>
              <div class="field">
                <label class="label" for="p-username">用户名</label>
                <div class="input-group">
                  <i class="fa-solid fa-user"></i>
                  <input class="input" id="p-username" maxlength="16" placeholder="3-16 位字母、数字或下划线">
                </div>
                <p class="field-error hidden" id="p-username-error"></p>
              </div>
              <div class="field">
                <label class="label" for="p-email">邮箱</label>
                <div class="input-group">
                  <i class="fa-solid fa-envelope"></i>
                  <input class="input" id="p-email" type="email" placeholder="用于登录与找回账号">
                </div>
                <p class="field-error hidden" id="p-email-error"></p>
              </div>

              <dl style="margin:0">
                <div class="profile-row"><dt>账号 ID</dt><dd id="p-id">—</dd></div>
                <div class="profile-row"><dt>注册时间</dt><dd id="p-created">—</dd></div>
                <div class="profile-row"><dt>最后登录</dt><dd id="p-lastlogin">—</dd></div>
              </dl>

              <button class="btn btn--primary" type="submit" id="profile-save">
                <i class="fa-solid fa-floppy-disk"></i>保存资料
              </button>
            </form>
          </div>

          <!-- 修改密码 -->
          <div class="card card--pad">
            <h3 style="font-size:15px;margin-bottom:6px">修改密码</h3>
            <p class="small dim" style="margin-bottom:14px">修改后其它设备上的登录会失效。</p>

            <form class="stack gap-4" id="password-form" novalidate>
              <div class="field">
                <label class="label" for="pwd-current">当前密码</label>
                <div class="input-group">
                  <i class="fa-solid fa-lock"></i>
                  <input class="input" id="pwd-current" type="password" autocomplete="current-password" placeholder="请输入当前密码">
                  <button type="button" class="input-group__action" data-toggle-password="pwd-current" aria-label="显示密码">
                    <i class="fa-solid fa-eye-slash"></i>
                  </button>
                </div>
                <p class="field-error hidden" id="pwd-current-error"></p>
              </div>
              <div class="field">
                <label class="label" for="pwd-new">新密码</label>
                <div class="input-group">
                  <i class="fa-solid fa-key"></i>
                  <input class="input" id="pwd-new" type="password" autocomplete="new-password" placeholder="不少于 6 位">
                  <button type="button" class="input-group__action" data-toggle-password="pwd-new" aria-label="显示密码">
                    <i class="fa-solid fa-eye-slash"></i>
                  </button>
                </div>
                <p class="field-error hidden" id="pwd-new-error"></p>
              </div>
              <div class="field">
                <label class="label" for="pwd-confirm">确认新密码</label>
                <div class="input-group">
                  <i class="fa-solid fa-key"></i>
                  <input class="input" id="pwd-confirm" type="password" autocomplete="new-password" placeholder="再次输入新密码">
                </div>
                <p class="field-error hidden" id="pwd-confirm-error"></p>
              </div>

              <button class="btn btn--primary" type="submit" id="password-save">
                <i class="fa-solid fa-shield-halved"></i>修改密码
              </button>
            </form>
          </div>

          <div class="card card--pad" style="margin-top:18px">
            <div class="row--between" style="margin-bottom:12px">
              <div>
                <h3 style="font-size:15px">登录设备</h3>
                <p class="tiny dim" style="margin-top:4px">发现不认识的设备，直接退出它即可</p>
              </div>
              <button class="btn btn--outline btn--sm" id="session-revoke-others">
                <i class="fa-solid fa-right-from-bracket"></i>退出其它设备
              </button>
            </div>
            <div id="session-list">
              <div class="empty"><div class="spinner"></div><p>加载中…</p></div>
            </div>
          </div>
        </div>
      </section>

    </div>
  </div>
</div>

<script src="/static/app.js" defer></script>
<script src="/static/pages/user.js" defer></script>
</body>
</html>
