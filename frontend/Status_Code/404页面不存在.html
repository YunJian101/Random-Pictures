<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · 找不到这个页面 | 随机图 API</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      onerror="this.onerror=null;this.href='https://lib.baomitu.com/font-awesome/6.5.1/css/all.min.css'">
<style>
  .err {
    position: relative;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px 20px;
    overflow: hidden;
  }
  .err__glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    pointer-events: none;
  }
  .err__glow--a { width: 46%; height: 46%; left: 6%; top: -8%; background: radial-gradient(circle, color-mix(in srgb, var(--primary) 40%, transparent), transparent 68%); }
  .err__glow--b { width: 40%; height: 40%; right: 4%; bottom: -10%; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 26%, transparent), transparent 70%); }

  .err__card {
    position: relative;
    width: 100%;
    max-width: 560px;
    padding: 40px 36px 34px;
    border-radius: var(--r-xl);
    border: 1px solid transparent;
    background:
      linear-gradient(var(--surface), var(--surface)) padding-box,
      linear-gradient(140deg, color-mix(in srgb, var(--primary) 50%, transparent), color-mix(in srgb, var(--line) 92%, transparent) 46%, color-mix(in srgb, var(--accent) 34%, transparent)) border-box;
    box-shadow: var(--shadow-2);
    text-align: center;
  }

  .err__badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 13px;
    border-radius: var(--r-pill);
    background: color-mix(in srgb, var(--primary) 12%, transparent);
    color: var(--primary);
    font-size: 12.5px;
    font-weight: 600;
  }

  .err__code {
    margin: 18px 0 0;
    font-size: clamp(64px, 16vw, 104px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.05em;
    background: linear-gradient(135deg, var(--primary), color-mix(in srgb, var(--primary) 45%, var(--accent)));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .err__title { margin-top: 6px; font-size: 21px; letter-spacing: -0.02em; }
  .err__desc { margin-top: 8px; font-size: 14px; color: var(--text-2); line-height: 1.75; }

  .err__details {
    margin-top: 20px;
    padding: 12px 14px;
    border-radius: var(--r-sm);
    background: var(--surface-2);
    border: 1px solid var(--line);
    text-align: left;
    font-size: 12.5px;
    color: var(--text-2);
    line-height: 1.9;
    word-break: break-all;
  }
  .err__details span { color: var(--text-3); margin-right: 6px; }
  .err__details code { font-family: var(--mono); font-size: 12px; }

  .err__actions { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

  .err__foot { margin-top: 18px; font-size: 12px; color: var(--text-3); }

  @media (max-width: 560px) {
    .err__card { padding: 30px 20px 26px; }
  }
</style>
</head>
<body>
<main class="err">
  <div class="err__glow err__glow--a"></div>
  <div class="err__glow err__glow--b"></div>

  <div class="err__card">
    <span class="err__badge"><i class="fa-solid fa-compass"></i>页面不存在</span>
    <div class="err__code">404</div>
    <h1 class="err__title">找不到这个页面</h1>
    <p class="err__desc">链接可能已失效、被移动，或地址拼写有误。</p>

    <div class="err__details">
      <div><span>请求地址</span><code>{{page_url}}</code></div>
<div><span>站点</span><code>{{BASE_URL}}</code></div>
    </div>

    <div class="err__actions">
      <a class="btn btn--primary" href="/"><i class="fa-solid fa-house"></i>返回首页</a>
      <button class="btn btn--outline" onclick="history.length>1?history.back():location.href='/'">
        <i class="fa-solid fa-arrow-left"></i>返回上一页
      </button>
    </div>

    <p class="err__foot">随机图 API · 如需帮助请在站内提交反馈</p>
  </div>
</main>
</body>
</html>
