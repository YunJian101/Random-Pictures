<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 随机图 API</title>
<link rel="icon" id="favicon" href="/static/favicon.svg" type="image/svg+xml">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/page-auth.css">
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      onerror="this.onerror=null;this.href='https://lib.baomitu.com/font-awesome/6.5.1/css/all.min.css'">
</head>
<body class="auth-page">

<div class="auth">
  <!-- ================= 左侧品牌面板 ================= -->
  <aside class="auth__aside">
    <a class="auth__brand" href="/">
      <span class="brand__mark"><i class="fa-solid fa-images"></i></span>
      <span>随机图 API</span>
    </a>

    <div class="auth__pitch">
      <h1>一行链接<br><span>把随机图片接进你的作品</span></h1>
      <p>登录后可查看自己的反馈进度；管理员还能上传图片、维护分类与用户。</p>

      <div class="auth__points">
        <div class="auth__point">
          <i class="fa-solid fa-bolt"></i>
          <div>
            <b>调用无需登录</b>
            <span>公开接口直接返回图片，账号只用于后台管理</span>
          </div>
        </div>
        <div class="auth__point">
          <i class="fa-solid fa-layer-group"></i>
          <div>
            <b>按分类取图</b>
            <span>一个 type 参数即可限定场景，接口保持简单</span>
          </div>
        </div>
        <div class="auth__point">
          <i class="fa-solid fa-shield-halved"></i>
          <div>
            <b>会话安全</b>
            <span>HttpOnly Cookie 承载令牌，密码加盐哈希存储</span>
          </div>
        </div>
      </div>
    </div>

    <div class="auth__aside-foot">
      <span>© <span id="year">2026</span> Random Image API</span>
      <a href="https://github.com/YunJian101/Random-Pictures" target="_blank" rel="noopener" aria-label="GitHub">
        <i class="fa-brands fa-github"></i>
      </a>
    </div>
  </aside>

  <!-- ================= 右侧表单 ================= -->
  <main class="auth__main">
    <div class="auth__topbar">
      <a class="auth__mobile-brand" href="/">
        <span class="brand__mark"><i class="fa-solid fa-images"></i></span>
        <span class="brand__name" data-site-name>随机图 API</span>
      </a>
      <div class="row gap-2" style="margin-left:auto">
        <a class="icon-btn" href="/" title="返回首页"><i class="fa-solid fa-house"></i></a>
        <button class="icon-btn" data-theme-toggle title="切换主题" aria-label="切换主题">
          <i class="fa-solid fa-moon" data-theme-icon></i>
        </button>
      </div>
    </div>

    <div class="auth__card">
      <div class="auth__head">
        <h2 id="auth-title">欢迎回来</h2>
        <p id="auth-subtitle">登录你的账号以继续管理图片与反馈</p>
      </div>

      <div class="auth__switch" role="tablist">
        <button type="button" id="tab-login" class="is-active" role="tab">登录</button>
        <button type="button" id="tab-register" role="tab">注册</button>
      </div>

      <!-- ---------- 登录表单 ---------- -->
      <form class="auth-form" id="login-form" novalidate>
        <div class="field">
          <label class="label" for="login-account">用户名 / 邮箱</label>
          <div class="input-group">
            <i class="fa-solid fa-user"></i>
            <input class="input" id="login-account" name="account" autocomplete="username"
                   placeholder="请输入用户名或邮箱">
          </div>
          <p class="field-error hidden" id="login-account-error"></p>
        </div>

        <div class="field">
          <label class="label" for="login-password">密码</label>
          <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input class="input" id="login-password" name="password" type="password"
                   autocomplete="current-password" placeholder="请输入密码">
            <button type="button" class="input-group__action" data-toggle-password="login-password"
                    aria-label="显示密码"><i class="fa-solid fa-eye-slash"></i></button>
          </div>
          <p class="field-error hidden" id="login-password-error"></p>
        </div>

        <div class="auth__row">
          <label class="auth__check">
            <input type="checkbox" class="checkbox" id="remember-me"> 记住我（7 天）
          </label>
          <a class="auth__link" href="javascript:void(0)" id="forgot-link">忘记密码？</a>
        </div>

        <button class="btn btn--primary btn--lg btn--block auth__submit" type="submit" id="login-submit">
          <span>登录</span>
        </button>
      </form>

      <!-- ---------- 注册表单 ---------- -->
      <form class="auth-form hidden" id="register-form" novalidate>
        <div class="field">
          <label class="label" for="register-username">用户名</label>
          <div class="input-group">
            <i class="fa-solid fa-user"></i>
            <input class="input" id="register-username" autocomplete="username"
                   placeholder="3-16 位字母、数字或下划线">
          </div>
          <p class="field-error hidden" id="register-username-error"></p>
        </div>

        <div class="field">
          <label class="label" for="register-email">邮箱</label>
          <div class="input-group">
            <i class="fa-solid fa-envelope"></i>
            <input class="input" id="register-email" type="email" autocomplete="email"
                   placeholder="用于找回账号">
          </div>
          <p class="field-error hidden" id="register-email-error"></p>
        </div>

        <div class="field">
          <label class="label" for="register-password">设置密码</label>
          <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input class="input" id="register-password" type="password" autocomplete="new-password"
                   placeholder="不少于 6 位，建议字母 + 数字">
            <button type="button" class="input-group__action" data-toggle-password="register-password"
                    aria-label="显示密码"><i class="fa-solid fa-eye-slash"></i></button>
          </div>
          <div class="strength">
            <div class="strength__track"><div class="strength__fill" id="strength-fill"></div></div>
            <span class="strength__text" id="strength-text">密码强度</span>
          </div>
          <p class="field-error hidden" id="register-password-error"></p>
        </div>

        <div class="field">
          <label class="label" for="register-confirm">确认密码</label>
          <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input class="input" id="register-confirm" type="password" autocomplete="new-password"
                   placeholder="再次输入密码">
          </div>
          <p class="field-error hidden" id="register-confirm-error"></p>
        </div>

        <button class="btn btn--primary btn--lg btn--block auth__submit" type="submit" id="register-submit">
          <span>创建账号</span>
        </button>

        <p class="auth__foot" style="text-align:left;margin-top:2px">
          注册即表示你已阅读并同意本站的使用条款；首个注册账号将自动成为管理员。
        </p>
      </form>

      <div class="auth__foot" id="auth-foot">
        还没有账号？<a class="auth__link" href="javascript:void(0)" id="go-register">立即注册</a>
      </div>
    </div>
  </main>
</div>

<script src="/static/app.js" defer></script>
<script src="/static/pages/auth.js" defer></script>
</body>
</html>
